  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none !important;
      -webkit-user-select: none;

    }
    input, textarea { -webkit-user-select: text; user-select: text; }
    button, .picker-btn, .modal-item-btn { touch-action: manipulation; }

    body { margin: 0; padding: 0; background: #ffffff; color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; width: 100%; overflow-x: hidden; }
    .screen-wrapper { width: 100%; max-width: 420px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 16px 8px 16px; }

    .bottom-footer { width: 100%; text-align: center; color: #475569; font-family: 'Urbanist', sans-serif; font-size: 13px; font-weight: 800; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .raptor-emoji { font-size: 16px; }

    .ig-container { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0; }
    .company-logo-wrap { width: 80px; height: 80px; margin: 0 auto 16px auto !important; border-radius: 24px; background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(220, 39, 67, 0.3); }
    .company-logo-inner { width: 72px; height: 72px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Urbanist', sans-serif; font-weight: 800; color: #dc2743; font-size: 20px; letter-spacing: 1px; }

    .ig-input { width: 100%; padding: 12px 14px; margin-bottom: 10px; border: 1.5px solid #cbd5e1; border-radius: 12px; background-color: #ffffff; font-size: 13px; font-weight: 700; color: #1e293b; }
    .ig-input:focus { border-color: #0064e0; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    /* BUTTON-BASED DROPDOWN (does not freeze on phones) */
    .picker-btn {
      width: 100%; padding: 12px 14px; margin-bottom: 10px; border: 1.5px solid #cbd5e1; border-radius: 12px;

    /* VIEW ONLY DIV BOXES */

    /* STEP-BY-STEP SOFT LOCK */

    /* Messages float on top of the page, so they never push the form up or down (that shift caused wrong taps) */

    table.fmt tr.fmt-total td { background: #000; color: #fff; font-weight: 700; font-size: 15px; }

    table.mrep td { font-size: 10px; font-weight: 700; line-height: 1.2; padding: 2px 3px; border: 1px solid #000; text-align: center; white-space: normal; overflow-wrap: anywhere; word-break: break-word; font-family: Arial, sans-serif; }
    table.mrep td.mrep-left { text-align: left; font-size: 9px; padding: 2px 2px; }
    table.mrep.wide td { font-size: 9px; padding: 1px; white-space: nowrap; }
    table.mrep.wide td.mrep-left { font-size: 8.5px; white-space: normal; }
    table.mrep.wide tr.fmt-head td { font-size: 8px; white-space: normal; }
    table.mrep.wide tr.fmt-total td { font-size: 9px; }
    table.mrep.wide tr.fmt-title td { white-space: normal; font-size: 10px; line-height: 1.15; }
    table.mrep.wide tr.fmt-title td.fmt-date { font-size: 8px; }
    /* KAFEEL admin pages (Kitting Report, KIT STOCK, Edit Entry): poori chaudai, table side scroll ke saath */
    .screen-wrapper.wide { max-width: 100vw; padding: 10px 8px; }
    .screen-wrapper.wide .form-card { max-width: 100%; width: 100%; }
    .screen-wrapper.wide .ig-login-btn { max-width: 420px; margin-left: auto; margin-right: auto; display: block; }
    .screen-wrapper.wide .xl-wrap { overflow-x: auto; width: 100%; }
    table.mrep.wide tr.fmt-group td { font-size: 8px; }
    table.mrep tr.fmt-title td { background: #FFC000; color: #000; font-family: 'Arial Black', Arial, sans-serif; font-size: 12px; font-weight: 900; }
    table.mrep tr.fmt-title td.fmt-date { background: #BFBFBF; color: #000; font-family: Arial, sans-serif; font-size: 10px; font-weight: 700; }
    table.mrep tr.fmt-head td { background: #000; color: #fff; font-weight: 700; font-size: 10px; }
    table.mrep tr.fmt-group td { background: #fff; color: #000; font-family: 'Arial Black', Arial, sans-serif; font-size: 9px; }
    table.mrep tr.fmt-total td { background: #000; color: #fff; font-weight: 700; font-size: 11px; }
    /* KAFEEL Kitting Report / KIT STOCK: laptop par poori table ek screen me */
    table.fmt.fit td { font-size: 10px; padding: 1px 2px; overflow-wrap: anywhere; word-break: break-word; }
    table.fmt.fit tr.fmt-title td { font-size: 14px; }
    table.fmt.fit tr.fmt-head td { font-size: 9px; }
    table.fmt.fit tr.fmt-group td { font-size: 8px; }
    table.fmt.fit tr.fmt-total td { font-size: 10px; }
    table.fmt tr.fmt-title td { text-align: left; }
    table.fmt tr.clk { cursor: pointer; }
    table.xl td.name { text-align: left; }
    table.xl tr.clk { cursor: pointer; }
    table.xl tr.clk:active td { background: #eef6ff; }
    table.xl tr.xl-buy td { background: #f1f5f9; font-weight: 800; text-align: left; }

    .form-card { width: 100%; background: transparent; padding: 5px 10px; margin: auto 0; }
    .form-card h2 { font-family: 'Urbanist', sans-serif; text-align: center; color: #0064e0; margin-top: 0; margin-bottom: 12px; font-size: 16px; font-weight: 800; }
    .field-label { font-family: 'Urbanist', sans-serif; font-weight: 800; display: block; margin: 4px 0 3px 4px; color: #334155; font-size: 11px; text-align: left; }

    /* BOTTOM SHEET MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.55); z-index: 9999;

    .modal-sheet {

      border-radius: 24px 24px 0 0; padding: 18px 16px 24px 16px;
      max-height: 65vh; display: flex; flex-direction: column;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;

    }
    .modal-item-btn:active { background: #eff6ff; border-color: #0064e0; color: #0064e0; }

  <style id="theme">
    /* ===== THEME: look only. No behaviour or data is touched here. ===== */
    :root {
      --navy: #0b1b3a; --blue: #0064e0; --blue-deep: #1d4ed8; --amber: #ffc000;
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --card: #ffffff; --bg: #f3f6fb;
      --shadow: 0 12px 32px rgba(11, 27, 58, 0.09); --shadow-sm: 0 4px 14px rgba(11, 27, 58, 0.07);
    }
    html { background: var(--bg); }
    body { background: transparent; }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 520px at -5% -8%, rgba(0, 100, 224, 0.15), transparent 60%),
        radial-gradient(720px 440px at 105% 2%, rgba(255, 192, 0, 0.20), transparent 56%),
        radial-gradient(800px 500px at 50% 112%, rgba(29, 78, 216, 0.10), transparent 60%);
    }

    /* header */
    .top-header {
      margin-top: 6px; padding: 12px 10px 11px; background: rgba(255, 255, 255, 0.78);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.95); border-radius: 20px; box-shadow: var(--shadow-sm);
    }
    .company-title { font-size: 14px; letter-spacing: 0.7px; background: linear-gradient(90deg, #0b1b3a, #0064e0 55%, #0b1b3a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .sub-title {
      display: inline-block; margin-top: 7px; padding: 3px 13px; border-radius: 999px;
      background: #eaf2ff; color: var(--blue-deep); font-size: 10px; letter-spacing: 2.4px;
    }

    /* login: one centred card, logo on top */
    #loginScreen {
      background: var(--card); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow);
      padding: 26px 20px 22px; margin: auto 0; position: relative; overflow: hidden;
    }
    #loginScreen::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
      background: linear-gradient(90deg, var(--blue), var(--amber));
    }
    .company-logo-wrap {
      width: 92px; height: 92px; margin: 4px auto 14px auto !important; border-radius: 28px;
      background: linear-gradient(135deg, #ffc000 0%, #ff8a00 100%);
      box-shadow: 0 12px 26px rgba(255, 138, 0, 0.35); animation: glow 3.2s ease-in-out infinite;
    }
    .company-logo-inner { width: 84px; height: 84px; border-radius: 24px; background: var(--navy); color: #ffffff; font-size: 26px; letter-spacing: 2px; }
    .company-logo-inner span { color: var(--amber); font-size: 10px; letter-spacing: 2px; }
    .login-title { font-family: 'Urbanist', sans-serif; font-size: 20px; font-weight: 800; color: var(--navy); text-align: center; margin: 0; }
    .login-sub { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; margin: 4px 0 16px; }
    @keyframes glow { 0%, 100% { box-shadow: 0 12px 26px rgba(255, 138, 0, 0.30); } 50% { box-shadow: 0 14px 34px rgba(255, 138, 0, 0.55); } }

    /* inputs */
    .ig-input, .picker-btn {
      border: 1.5px solid #d5deec; border-radius: 14px; background-color: #f8fafc; padding: 13px 15px; font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
    }
    .ig-input:focus { border-color: var(--blue); background-color: #ffffff; box-shadow: 0 0 0 4px rgba(0, 100, 224, 0.14); }
    .picker-btn:active { background-color: #eef4ff; }
    .picker-arrow { color: var(--blue); }

    /* buttons */
    .ig-login-btn {
      border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 800; letter-spacing: 0.3px;
      box-shadow: 0 8px 18px rgba(0, 100, 224, 0.28); transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .ig-login-btn:active { transform: scale(0.98); box-shadow: 0 4px 10px rgba(0, 100, 224, 0.25); }
    .btn-logout { background: #fff1f2 !important; color: #be123c !important; border: 1px solid #fecdd3 !important; box-shadow: none !important; }

    /* menu buttons become tiles */
    #adminMenu .ig-login-btn:not(.btn-logout),
    #adminScreen .ig-login-btn:not(.btn-logout):not([onclick*="processExcel"]):not([onclick*="uploadFullFormat"]) {
      background: var(--card); color: var(--ink); text-align: left; border: 1px solid var(--line);
      box-shadow: var(--shadow-sm); padding: 15px 16px; margin-bottom: 9px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    #adminMenu .ig-login-btn:not(.btn-logout)::after,
    #adminScreen .ig-login-btn:not(.btn-logout):not([onclick*="processExcel"]):not([onclick*="uploadFullFormat"])::after {
      content: "\203A"; font-size: 24px; line-height: 1; color: #94a3b8; flex: none;
    }
    #adminMenu .ig-login-btn:not(.btn-logout):active,
    #adminScreen .ig-login-btn:not(.btn-logout):not([onclick*="processExcel"]):not([onclick*="uploadFullFormat"]):active { background: #eef4ff; border-color: #bfd6ff; }
    #adminPage > .ig-login-btn, #wReportScreen > .ig-login-btn { margin-bottom: 4px; }

    /* page headings: banner */
    .form-card h2 {
      background: linear-gradient(135deg, #0b1b3a 0%, #1e3a8a 58%, #0064e0 100%); color: #ffffff;
      padding: 15px 14px; border-radius: 18px; font-size: 17px; letter-spacing: 0.3px;
      box-shadow: var(--shadow); margin: 8px 0 14px;
    }
    .field-label { color: #475569; font-size: 11.5px; letter-spacing: 0.3px; }

    /* cards, tables, popups, modal */
    .althf-card { border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 16px; box-shadow: var(--shadow-sm); }
    .xl-wrap { border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); background: #ffffff; }
    .error-popup, .success-popup { border-radius: 14px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.14); font-weight: 800; }
    .modal-sheet { border-radius: 26px 26px 0 0; box-shadow: 0 -14px 44px rgba(11, 27, 58, 0.28); }
    .modal-item-btn { border-radius: 14px; }
    .readonly-div-box, .live-calc-div-box { border-radius: 14px; }
    .bottom-footer { color: var(--muted); letter-spacing: 0.4px; }

    /* spacing + file picker */
    .grid-art-batch { grid-template-columns: minmax(0, 65fr) minmax(0, 35fr); }
    #workerScreen .ig-login-btn { margin-bottom: 8px; }
    #adminScreen .ig-login-btn[onclick*="processExcel"], #adminScreen .ig-login-btn[onclick*="uploadFullFormat"] { margin-bottom: 16px; }
    .form-card .field-label { margin-top: 8px; }
    .ig-input[type="file"]::file-selector-button {
      border: none; background: #eaf2ff; color: var(--blue-deep); font-weight: 800; border-radius: 10px;
      padding: 8px 12px; margin-right: 10px; cursor: pointer;
    }

    /* gentle entrance when a screen opens */
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    #loginScreen, .form-card:not(.hidden) { animation: rise 0.32s ease both; }
    @media (min-width: 900px) { .screen-wrapper:not(.wide) { max-width: 460px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
      .pin-mask { -webkit-text-security: disc; text-security: disc; }
  </style>

      function post(body, onOk, onFail) {
        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body)
        })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j.error) onFail(new Error(j.error));
            else onOk(j.message !== undefined ? j.message : j.result);
          })
          .catch(onFail);
      }

      // Admin calls: POST ke saath admin PIN jaata hai, jawab mein result aata hai
      function adminCall(action, args, onOk, onFail) {
        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ type: "admin", action: action, args: args, pin: adminPin })
        })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j.error) onFail(new Error(j.error));
            else onOk(j.result);
          })
          .catch(onFail);
      }

      const FUNCS = ["verifyPin", "getOrdersForWorker", "submitReport", "saveExcelOrders", "saveAlthfData", "getAlthfData", "saveCharPackData", "getCharPackData", "adminSummary", "adminSummaryDetail", "adminSetNoWork", "adminWorkerLog", "adminEditEntry", "adminSetPin", "adminRecalcAll", "adminLog", "adminSetPins", "adminStockReport", "adminFullReport", "adminArticleEntries", "adminDeleteEntry", "adminAddEntry", "adminSetCharPack", "adminGetFormat", "adminGetFormatFile", "adminSaveFormatFile", "adminMemberReport", "adminDeleteBuy", "saveKittingFormat", "workerList", "workerEdit", "workerDelete", "workerReport", "workerFormatFile"];

      function makeRun(okH, failH) {
        const run = {
          withSuccessHandler: function (h) { return makeRun(h, failH); },
          withFailureHandler: function (h) { return makeRun(okH, h); }
        };
        FUNCS.forEach(function (fn) {
          run[fn] = function () {
            const args = Array.prototype.slice.call(arguments);
            const onOk = function (res) {
              if (fn === "verifyPin" && res && res.success) {
                pins[args[0]] = args[1];
              }
              if (fn === "verifyPin" && res && res.success && ["SADIQ", "KAFEEL", "ALTHF"].indexOf(args[0]) >= 0) {
                adminPin = args[1];
              }
              if (okH) okH(res);
            };
            const onFail = function (err) { if (failH) failH(err); };
            if (fn.indexOf("admin") === 0) adminCall(fn, args, onOk, onFail);
            else if (fn === "saveExcelOrders") post({ orders: args[0], pin: adminPin }, onOk, onFail);
            else if (fn === "saveKittingFormat") post({ type: "format", rows: args[0], pin: adminPin }, onOk, onFail);
            else if (fn === "workerList" || fn === "workerEdit" || fn === "workerDelete" || fn === "workerReport" || fn === "workerFormatFile") post({ type: "worker", action: fn, worker: args[0], pin: pins[args[0]] || "", args: args.slice(1) }, onOk, onFail);
            else if (fn === "verifyPin") post({ type: "verify", worker: args[0], pin: args[1] }, onOk, onFail);
            else if (fn === "getOrdersForWorker") post({ type: "worker", action: "workerOrders", worker: args[0], pin: pins[args[0]] || "", args: [args[1] || ""] }, onOk, onFail);
            else if (fn === "submitReport") { const sd = args[0] || {}; post({ type: "worker", action: "workerSubmit", worker: sd.worker, pin: pins[sd.worker] || "", args: [sd] }, onOk, onFail); }
            else jsonp(fn, args, onOk, onFail);
          };
        });
        return run;
      }

      window.__clearAuth = function () {
        adminPin = "";
        Object.keys(pins).forEach(function (k) { delete pins[k]; });
      };

      window.google = { script: { run: makeRun(null, null) } };

    // Excel jaisi table: ek hi data se screen, PDF aur Excel teeno bante hain.
    // Har line: { cls, cells: [{ t, span, cls }] }. Buy ka title, heading, member ka naam (group row),
    // har 4 articles ke baad TOTAL, aur aakhir me GRAND TOTAL.
    function buildReportMatrix(rep, who) {
      const heads = ['BATCH NO', 'Style Name', 'Order QTY'].concat(rep.headers);
      const nCols = heads.length;
      const nVals = rep.headers.length + 1; // Order QTY + member ke columns
      const now = new Date();
      const pad = function (n) { return (n < 10 ? '0' : '') + n; };
      const asOn = pad(now.getDate()) + '-' + pad(now.getMonth() + 1) + '-' + now.getFullYear();
      const lines = [];
      const addLine = function (cls, cells) { lines.push({ cls: cls, cells: cells }); };
      const num = function (v) { const n = Number(v); return isFinite(n) ? n : 0; };
      const zeros = function () { return new Array(nVals).fill(0); };
      const addTotal = function (label, sums) { addLine('fmt-total', [{ t: label, span: 2 }].concat(sums.map(function (v) { return { t: v }; }))); };

      // Buy ke hisab se groups (rows pehle se buy ke order me aati hain)
      const groups = [];
      rep.rows.forEach(function (r) {
        const last = groups[groups.length - 1];
        if (last && last.buy === r.buyName) last.rows.push(r);
        else groups.push({ buy: r.buyName, rows: [r] });
      });

      let grand = zeros();
      groups.forEach(function (g) {
        const total = g.rows.reduce(function (s, r) { return s + num(r.order); }, 0);
        addLine('fmt-title', [
          { t: admFmtTitle(g.buy, total, who), span: nCols - 2 },
          { t: 'AS ON DATE\n' + asOn, span: 2, cls: 'fmt-date' }
        ]);
        addLine('fmt-head', heads.map(function (h) { return { t: h }; }));
        addLine('fmt-group', [{ t: '', span: 3 }, { t: who, span: rep.headers.length }]);
        let block = zeros();
        const gg = zeros();
        g.rows.forEach(function (r, i) {
          const vals = [r.order].concat(r.values);
          const cells = vals.map(function (v) { return { t: v }; });
          cells.unshift({ t: r.batch, cls: 'mrep-left' }, { t: r.articleName });
          addLine('', cells);
          vals.forEach(function (v, j) {
            block[j] += num(v);
            grand[j] += num(v);
            gg[j] += num(v);
          });
          if ((i + 1) % 4 === 0 || i === g.rows.length - 1) {
            addTotal('TOTAL', block);
            block = zeros();
          }
        });
        addTotal('GRAND TOTAL', gg);
      });
      if (groups.length > 1) addTotal('GRAND TOTAL', grand);
      return { nCols: nCols, lines: lines };
    }

    // Screen par table banati hai (ek hi wrapper me)
    function drawReportTable(mx) {
      const wrap = document.createElement('div');
      wrap.style.overflowX = 'auto';
      const tbl = document.createElement('table');
      tbl.className = 'fmt';
      mx.lines.forEach(function (ln) {
        const tr = document.createElement('tr');
        if (ln.cls) tr.className = ln.cls;
        ln.cells.forEach(function (o) {
          const td = document.createElement('td');
          td.innerText = (o.t === undefined || o.t === null) ? '' : o.t;
          if (o.span) td.colSpan = o.span;
          if (o.cls) td.className = o.cls;
          tr.appendChild(td);
        });
        tbl.appendChild(tr);
      });
      wrap.appendChild(tbl);
      return wrap;
    }

    const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const ALL_MEMBERS = ['KUMAR', 'ZESAN', 'IMTHIYAZ', 'MUDASSIR', 'LOKASH', 'ALTHF', 'SARAVANAN'];
    let fmtB64Cache = null;

    function admPromise(fn, args) {
      return new Promise(function (resolve, reject) {
        const run = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(new Error((e && e.message) || 'Server error')); });
        run[fn].apply(null, args);
      });
    }

    // Format file server se (ek baar, cache me). Admin ke liye adminGetFormatFile, member ke liye workerFormatFile.
    function getFormatB64() {
      if (fmtB64Cache) return Promise.resolve(fmtB64Cache);
      const isAdminUser = (loggedInWorker === 'KAFEEL' || loggedInWorker === 'SADIQ');
      const call = new Promise(function (resolve, reject) {
        const run = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(new Error((e && e.message) || 'Server error')); });
        if (isAdminUser) run.adminGetFormatFile(); else run.workerFormatFile(loggedInWorker);
      });
      return call.then(function (s) {
        fmtB64Cache = s || FMT_TEMPLATE_B64;
        return fmtB64Cache;
      }).catch(function () { return FMT_TEMPLATE_B64; });
    }

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function findTemplate(wb, name) {
      const want = String(name).toLowerCase();
      const ws = wb.worksheets.find(function (w) { return String(w.name).toLowerCase() === want; });
      if (!ws) throw new Error('Sheet "' + name + '" was not found in the format file. Ask SADIQ to upload the full format file again.');
      return ws;
    }

    // Ek report sheet: template ke merges (title/date), styles, widths aur row height ke saath.
    function fillReportSheet(wb, tpl, mx, sheetName) {
      const ws = wb.addWorksheet(String(sheetName).slice(0, 31));
      const spanAt = function (row, col) {
        const c0 = tpl.getCell(row, col);
        if (!c0.isMerged) return 1;
        let k = 1;
        while (tpl.getCell(row, col + k).isMerged && tpl.getCell(row, col + k).master.address === c0.master.address) k++;
        return k;
      };
      const w1 = spanAt(1, 2);
      const w2 = spanAt(1, 2 + w1);
      const useTplTitle = (w1 + w2 === mx.nCols);
      for (let c = 1; c <= Math.max(tpl.columnCount, mx.nCols + 1); c++) {
        const w = tpl.getColumn(c).width;
        if (w) ws.getColumn(c).width = w;
      }
      const ROW_OF = { 'fmt-title': 1, 'fmt-head': 2, 'fmt-group': 3, 'fmt-total': 8, '': 4 };
      const styleAt = function (row, col) { return JSON.parse(JSON.stringify(tpl.getCell(row, col).style || {})); };
      let r = 0;
      mx.lines.forEach(function (ln) {
        r++;
        const cls = ln.cls || '';
        let srow = ROW_OF[cls] !== undefined ? ROW_OF[cls] : 4;
        if (cls === 'fmt-total' && ln.cells[0] && ln.cells[0].t === 'GRAND TOTAL') srow = 22;
        let cells = ln.cells;
        if (cls === 'fmt-title' && useTplTitle && cells.length === 2) {
          cells = [Object.assign({}, cells[0], { span: w1 }), Object.assign({}, cells[1], { span: w2 })];
        }
        let c = 2;
        cells.forEach(function (o) {
          const span = o.span || 1;
          for (let k = 0; k < span; k++) ws.getCell(r, c + k).style = styleAt(srow, c + k);
          if (o.t !== undefined && o.t !== null && o.t !== '') ws.getCell(r, c).value = o.t;
          if (span > 1) ws.mergeCells(r, c, r, c + span - 1);
          c += span;
        });
        const h = tpl.getRow(srow).height;
        if (h) ws.getRow(r).height = h;
      });
      // Table ke chaaron taraf dark black line
      const lastCol = 2 + mx.nCols - 1;
      const dark = { style: 'medium', color: { argb: 'FF000000' } };
      for (let c = 2; c <= lastCol; c++) {
        ws.getCell(1, c).border = Object.assign({}, ws.getCell(1, c).border, { top: dark });
        ws.getCell(r, c).border = Object.assign({}, ws.getCell(r, c).border, { bottom: dark });
      }
      for (let rr = 1; rr <= r; rr++) {
        ws.getCell(rr, 2).border = Object.assign({}, ws.getCell(rr, 2).border, { left: dark });
        ws.getCell(rr, lastCol).border = Object.assign({}, ws.getCell(rr, lastCol).border, { right: dark });
      }
      ws.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
      return ws;
    }

    // items: [{ tpl, mx, sheetName }]. Ek workbook me sab sheets; format ki template sheets hata di jaati hain.
    async function buildBook(items) {
      if (!window.ExcelJS) throw new Error('Excel library did not load. Check the internet connection and try again.');
      const b64 = await getFormatB64();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(b64ToBytes(b64).buffer);
      const originals = wb.worksheets.map(function (w) { return w.id; });
      items.forEach(function (it) {
        fillReportSheet(wb, findTemplate(wb, it.tpl), it.mx, it.sheetName);
      });
      originals.forEach(function (id) { wb.removeWorksheet(id); });
      const buf = await wb.xlsx.writeBuffer();
      return new Blob([buf], { type: XLSX_MIME });
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }

      if (!split) return [''];
      const list = admBuyFilter ? [admBuyFilter] : admBuyNames();
      return list.length ? list : [''];

    function fileTag(base, b) { return b ? base + '_' + b.replace(/[^A-Za-z0-9_-]+/g, '_') : base; }

    // Har buy ke liye ek Excel file banati hai.
    async function makeReportFiles(build, baseTag, split) {
      const out = [];
      const buys = exportBuys(split);
      for (let i = 0; i < buys.length; i++) {
        const items = await build(buys[i]);
        const built = await makeReportFile(items, split ? fileTag(baseTag, buys[i]) : baseTag);
        if (built) out.push(built);
      }
      return out;
    }



    function downloadBuilts(builts) {
      if (!builts.length) return;
      builts.forEach(function (x, i) { setTimeout(function () { downloadBlob(x.blob, x.name); }, i * 500); });
      rptNote('Downloaded: ' + builts.map(function (x) { return x.name; }).join(', '));

    // SADIQ: full format Excel ek baar upload. Zaroori sheets check hoti hain.
    async function uploadFullFormat() {
      const fileInput = document.getElementById('fullFmtFile');
      if (!fileInput.files.length) { showMsg('adminMsgBox', 'error', '⚠️ Select the full format Excel file first'); return; }
      try {
        const buf = await fileInput.files[0].arrayBuffer();
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buf);
        const names = wb.worksheets.map(function (w) { return String(w.name).toLowerCase(); });
        const need = ['all kitting report format', 'kit stock format'].concat(ALL_MEMBERS.map(function (m) { return (m + ' report format').toLowerCase(); }));
        const missing = need.filter(function (n) { return names.indexOf(n) < 0; });
        if (missing.length) { showMsg('adminMsgBox', 'error', '❌ These sheets are missing in the file: ' + missing.join(', ')); return; }
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        const msg = await admPromise('adminSaveFormatFile', [btoa(bin)]);
        fmtB64Cache = null;
        showMsg('adminMsgBox', 'success', msg || '✅ Full format saved');
        fileInput.value = '';
      } catch (err) {
        showMsg('adminMsgBox', 'error', '❌ ' + ((err && err.message) || 'Upload failed'));
      }
    }

    const SM_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const SM_DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    function smShift(ms) { return new Date(ms + 330 * 60000); }
    function smTime(ms) {
      const d = smShift(ms); let h = d.getUTCHours(); const m = d.getUTCMinutes();
      const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12;
      return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
    }
    function smDayKey(ms) { return smShift(ms).toISOString().slice(0, 10); }
    function smDayLabel(key) {
      const d = new Date(key + 'T00:00:00Z');
      return SM_DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + SM_MONTHS[d.getUTCMonth()];

    function smLast(ms, s) {
      if (!ms) return 'No entry yet';
      const k = smDayKey(ms);
      if (k === s.today) return 'Today ' + smTime(ms);

      return smDayLabel(k) + ' ' + smTime(ms);

    // Group header spans: a column with g starts a new group; columns before the first g form one blank group.
    function admGroupSpans(cols) {
      const spans = [];
      cols.forEach(function (c) {
        if (c.g !== undefined || spans.length === 0) spans.push([c.g || '', 1]);
        else spans[spans.length - 1][1]++;
      });
      return spans;
    }

    const KIT_FMT_COLS = [

      { h: 'Order QTY', f: o => o.order },
      { g: 'LOKASH', h: 'kit issue', f: o => o.kitIssue },
      { g: '', h: 'KIT STOCK', f: o => o.kitStock },
      { g: 'SARAVANAN', h: 'charging', f: o => o.charging },
      { h: 'packing', f: o => o.packing },
      { g: '', h: 'Line wip', f: o => o.lineWip }

    // Title for one buy with its total pairs. Uses the buy name from the uploaded format when it matches.
    function admFmtTitle(buy, total, label) {
      const f = (admFormat && admFormat.title) ? admFormat.title : '';
      const m = f.match(/^(.*?)\s+PAIRS/i);
      const norm = function (s) { return String(s).replace(/[\s\-]+/g, ' ').trim().toUpperCase(); };
      const name = (m && norm(m[1]) === norm(buy)) ? m[1].replace(/\s+/g, ' ').trim() : String(buy);
      return name.toUpperCase() + ' PAIRS (' + total + ') ' + label;
    }

    // Same look as the format Excel. Used for the Kitting Report and the KIT STOCK (line-wise) view.
    // Per buy: amber title, black heading row, group row, articles in blocks of 4 with a black TOTAL after each block.
    // GRAND TOTAL at the end.
    function admRenderFormat(wrap, rows, cols, widths, useFormatHeads, label) {
      wrap.innerHTML = "";
      if (!rows.length) { wrap.innerText = 'No data yet. Upload the master Excel first.'; return; }
      const N = cols.length;
      const dateSpan = N >= 26 ? 6 : 2;
      const heads = cols.map(function (c, i) {
        return (useFormatHeads && admFormat && admFormat.heads && admFormat.heads[i]) ? admFormat.heads[i] : c.h;
      });
      const today = new Date().toLocaleDateString('en-GB');
      const t = document.createElement('table');
      t.className = 'fmt';
      const cg = document.createElement('colgroup');
      const pxs = widths.map(function (w) { return Math.round(w * 7 + 5); });
      const totalPx = pxs.reduce(function (a, b) { return a + b; }, 0);
      // Laptop/desktop: poori table screen ki chaudai me fit. Chhoti screen: pixel width ke saath side scroll.
      const fitWide = window.innerWidth >= 900;
      if (fitWide) {
        t.classList.add('fit');
        t.style.width = '100%';
        t.style.tableLayout = 'fixed';
      } else {
        t.style.width = totalPx + 'px';
      }
      pxs.forEach(function (px, i) {
        const col = document.createElement('col');
        col.style.width = fitWide ? ((px / totalPx) * 100).toFixed(3) + '%' : px + 'px';
        cg.appendChild(col);
      });
      t.appendChild(cg);
      const tb = document.createElement('tbody');
      t.appendChild(tb);
      function row(cls) { const tr = document.createElement('tr'); if (cls) tr.className = cls; return tr; }
      function cell(tr, v, span, cls) {
        const td = document.createElement('td');
        if (span) td.colSpan = span;
        td.innerText = (v === undefined || v === null) ? '' : String(v);
        if (cls) td.className = cls;
        tr.appendChild(td);
      }
      function sumRow(list, labelText) {
        const tr = row('fmt-total');
        cols.forEach(function (c, i) {
          if (i === 0) { cell(tr, labelText); return; }
          if (c.text) { cell(tr, ''); return; }
          let s = 0;
          list.forEach(function (o) { s += Number(c.f(o)) || 0; });
          cell(tr, s);
        });
        return tr;
      }
      // group rows by buy, in order of first appearance
      const groups = [];
      const idx = {};
      rows.forEach(function (o) {
        const k = o.buyName || '';
        if (!(k in idx)) { idx[k] = groups.length; groups.push({ name: k, list: [] }); }
        groups[idx[k]].list.push(o);
      });
      groups.forEach(function (g) {
        let total = 0;
        g.list.forEach(function (o) { total += Number(o.order) || 0; });
        const title = row('fmt-title');
        cell(title, admFmtTitle(g.name, total, label), N - dateSpan);
        cell(title, 'AS ON DATE: ' + today, dateSpan, 'fmt-date');
        const hr = row('fmt-head');
        heads.forEach(function (hd) { cell(hr, hd); });
        const gr = row('fmt-group');
        admGroupSpans(cols).forEach(function (sp) { cell(gr, sp[0], sp[1]); });
        tb.appendChild(title);
        tb.appendChild(hr);
        tb.appendChild(gr);
        for (let i = 0; i < g.list.length; i += 4) {
          const block = g.list.slice(i, i + 4);
          block.forEach(function (o) {
            const tr = row('clk');
            tr.onclick = function () { admArticleDetail(o.articleNo, undefined, o.buyName); };
            cols.forEach(function (c) {
              cell(tr, c.f(o), 0, c.h === 'Style Name' ? 'name' : '');
            });
            tb.appendChild(tr);
          });
          tb.appendChild(sumRow(block, 'TOTAL'));
        }
        tb.appendChild(sumRow(g.list, 'GRAND TOTAL'));
      });
      if (groups.length > 1) tb.appendChild(sumRow(rows, 'GRAND TOTAL'));
      wrap.appendChild(t);
    }

    // Kitting Report ka matrix (PDF / Excel / share ke liye). Screen wale admRenderFormat ka same logic.
    function admFormatMatrix(rows, cols, useFormatHeads, label) {
      const N = cols.length;
      const dateSpan = N >= 26 ? 6 : 2;
      const heads = cols.map(function (c, i) {
        return (useFormatHeads && admFormat && admFormat.heads && admFormat.heads[i]) ? admFormat.heads[i] : c.h;
      });
      const today = new Date().toLocaleDateString('en-GB');
      const lines = [];
      const add = function (cls, cells) { lines.push({ cls: cls, cells: cells }); };
      const sumLine = function (list, text) {
        const cells = [{ t: text, span: 2 }];
        cols.forEach(function (c, i) {
          if (i < 2) return;
          if (c.text) { cells.push({ t: '' }); return; }
          let s = 0;
          list.forEach(function (o) { s += Number(c.f(o)) || 0; });
          cells.push({ t: s });
        });
        add('fmt-total', cells);
      };
      const groups = [];
      const idx = {};
      rows.forEach(function (o) {
        const k = o.buyName || '';
        if (!(k in idx)) { idx[k] = groups.length; groups.push({ name: k, list: [] }); }
        groups[idx[k]].list.push(o);
      });
      groups.forEach(function (g) {
        let total = 0;
        g.list.forEach(function (o) { total += Number(o.order) || 0; });
        add('fmt-title', [
          { t: admFmtTitle(g.name, total, label), span: N - dateSpan },
          { t: 'AS ON DATE: ' + today, span: dateSpan, cls: 'fmt-date' }
        ]);
        add('fmt-head', heads.map(function (hd) { return { t: hd }; }));
        add('fmt-group', admGroupSpans(cols).map(function (sp) { return { t: sp[0], span: sp[1] }; }));
        for (let i = 0; i < g.list.length; i += 4) {
          const block = g.list.slice(i, i + 4);
          block.forEach(function (o) {
            add('', cols.map(function (c) { return { t: c.f(o) }; }));
          });
          sumLine(block, 'TOTAL');
        }
        sumLine(g.list, 'GRAND TOTAL');
      });
      if (groups.length > 1) sumLine(rows, 'GRAND TOTAL');
      return { nCols: N, lines: lines, kitting: N >= 26 };
    }

    function admLoadEntries(a, list, openW) {
      admCall('adminArticleEntries', [a, admArtBuy], function (rows) {

        if (openW === 'SARAVANAN' || openW === 'ALTHF') { admItemsEdit(a, list, openW); return; }

      function watch(inputEl, liveEl, others) {
        inputEl.addEventListener('input', function () {
          const typed = Number(inputEl.value);
          const val = (inputEl.value === '' || !isFinite(typed)) ? 0 : typed;

        live.className = 'althf-art';

    // ===== Push notifications (OneSignal). Fails silently if the service is blocked. =====
    let pushReady = false;
    function pushInit() {
      try {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        const base = location.pathname.replace(/[^\/]*$/, '');
        window.OneSignalDeferred.push(async function (OneSignal) {
          try { await OneSignal.init({
            appId: "904c7ffa-90c0-41a3-b91a-a3949fe03a43",
            serviceWorkerPath: base.slice(1) + "sw.js",
            serviceWorkerParam: { scope: base },
            notifyButton: { enable: false },
            allowLocalhostAsSecureOrigin: true
          }); } catch (e) { window.pushErr = String((e && e.message) || e); return; }
          pushReady = true;
          if (loggedInWorker) pushLogin(loggedInWorker);
        });
      } catch (e) { }
    }
    function pushDo(fn) {
      try { (window.OneSignalDeferred = window.OneSignalDeferred || []).push(function (O) { try { fn(O); } catch (e) { } }); } catch (e) { }
    }
    function pushLogin(name) {
      pushDo(function (O) { O.login(name); });
      pushShowBar();
    }
    function pushLogout() { pushDo(function (O) { O.logout(); }); document.getElementById('pushBar').style.display = 'none'; }
    function pushSay(txt, showBtn) {
      const bar = document.getElementById('pushBar');
      document.getElementById('pushTxt').innerText = txt;
      document.getElementById('pushBtn').style.display = showBtn ? '' : 'none';
      bar.style.display = 'flex';
    }
    function pushShowBar() {
      try {
        if (!('Notification' in window)) { pushSay('🔔 Notifications need the installed app (on iPhone: add to Home Screen first).', false); return; }
        if (Notification.permission === 'granted') { pushSay('Checking notifications...', false); setTimeout(function () { pushCheck(0); }, 1500); return; }
        if (Notification.permission === 'denied') { pushSay('🔕 Notifications are blocked. Phone Settings → Apps → Chrome (or this app) → Notifications → Allow.', false); return; }
        pushSay('🔔 Get report reminders on this phone (v5)', true);
      } catch (e) { }
    }
    function pushHide() { document.getElementById('pushBar').style.display = 'none'; }
    function pushEnable() {
      try {
        if (!('Notification' in window)) { pushShowBar(); return; }
        if (Notification.permission === 'denied') { pushShowBar(); return; }
        pushSay('Please tap Allow in the box that appears...', false);
        // ask the phone directly (works even if the push service is slow)
        Notification.requestPermission().then(function (p) {
          if (p !== 'granted') { pushShowBar(); return; }
          pushSay('Allowed. Connecting...', false);
          pushDo(function (O) { O.login(loggedInWorker); try { O.User.PushSubscription.optIn(); } catch (e) { } });
          setTimeout(function () { pushCheck(0); }, 2500);
        });
      } catch (e) { pushSay('Could not ask for permission. Please try again.', true); }
    }
    function pushCheck(tries) {
      tries = tries || 0;
      let answered = false;
      pushDo(function (O) {
        answered = true;
        let ok = false;
        try { ok = !!(O.User.PushSubscription.id && O.User.PushSubscription.optedIn); } catch (e) { }
        if (ok) { pushSay('✅ Notifications are ON for ' + loggedInWorker, false); setTimeout(pushHide, 4000); }
        else if (tries < 8) { setTimeout(function () { pushCheck(tries + 1); }, 2500); }
        else { pushSay('⚠️ Not connected' + (window.pushErr ? ': ' + window.pushErr : ' yet. Close the app, open it again and log in.'), true); }
      });
      setTimeout(function () { if (!answered && tries === 0) pushSay('⚠️ Notification service did not load' + (window.pushErr ? ': ' + window.pushErr : '') + '. Check internet and try again.', true); }, 6000);
    }
    window.addEventListener('load', pushInit);

    function calcBalance() {
      if (!step2Done) return;
      const curBalStr = document.getElementById('w_curBal').innerText;
      const curBal = Number(curBalStr) || 0;
      const outputVal = document.getElementById('w_output').value;
      const output = Number(outputVal) || 0;
      const btn = document.getElementById('workerSubmitBtn');

      if (curBalStr !== "") {
        let calculatedBalance = curBal - output;
        if (calculatedBalance < 0) { calculatedBalance = 0; }
        document.getElementById('w_newBal').innerText = calculatedBalance;

        if (outputVal !== "" && output > 0) {
          step3Done = true;
          btn.classList.remove('locked-btn');
        } else {
          step3Done = false;
          btn.classList.add('locked-btn');
        }
      }
    }

    function sendWorkerData() {
      killKeyboard();
      const btn = document.getElementById('workerSubmitBtn');
      const curBal = Number(document.getElementById('w_curBal').innerText) || 0;
      const output = Number(document.getElementById('w_output').value) || 0;

      if (!step3Done || output <= 0) {
        showMsg('workerMsgBox', 'error', '⚠️ Enter the quantity first!');
        return;
      }
      if (output > curBal) {
        showMsg('workerMsgBox', 'error', '⚠️ More than the balance. Balance: ' + curBal);
        return;
      }

      const data = {
        worker: loggedInWorker,
        item: currentItem,
        date: new Date().toISOString().split('T')[0],
        buy: document.getElementById('w_buy').value,
        field1: document.getElementById('w_article').value,
        field2: document.getElementById('w_artName').innerText + " | " + document.getElementById('w_batch').innerText,
        field3: output,
        remarks: ""
      };

      btn.innerText = "Saving Data...";
      step3Done = false;
      btn.classList.add('locked-btn');

      // Keeps the quantity on screen so the worker can try again
      const restoreForRetry = function () {
        btn.innerText = "Report Submit 🚀";
        step3Done = true;
        btn.classList.remove('locked-btn');
      };

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            btn.innerText = "Report Submit 🚀";
            showMsg('workerMsgBox', 'success', res.message);
            resetLockSystem();
            fetchMasterOrders();
          } else {
            restoreForRetry();
            showMsg('workerMsgBox', 'error', (res && res.message) || '❌ Not saved.');
          }
        })
        .withFailureHandler(function () {
          restoreForRetry();
          showMsg('workerMsgBox', 'error', '❌ Could not connect to server. Check the balance first to see if it saved.');
        })
        .submitReport(data);
    }

    // ADMIN: Excel upload
    function processExcel() {
      const fileInput = document.getElementById('excelFile');
      if (fileInput.files.length === 0) { showMsg('adminMsgBox', 'error', '⚠️ Please select an Excel file first!'); return; }

      const btn = document.getElementById('uploadExcelBtn');
      const resetBtn = function () { btn.disabled = false; btn.innerText = "Upload & Sync Orders 🚀"; };
      btn.disabled = true;
      btn.innerText = "Reading Excel... ⏳";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onerror = function () {
        resetBtn();
        showMsg('adminMsgBox', 'error', '❌ Could not read the file.');
      };

      reader.onload = function (e) {
        let formattedOrders = [];
        try {
          if (typeof XLSX === 'undefined') throw new Error('Excel library did not load');
          const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          // Har tab (sheet) padha jata hai. Row 1 heading hai, data row 2 se shuru.
          // Columns: A Buy Name | B PO Number | C Batch | D Article Number | E Article Name | F Order Pairs
          workbook.SheetNames.forEach(function (sheetName) {
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
            rows.slice(1).forEach(function (r) {
              const buy = String(r[0]).trim();
              const artNo = String(r[3]).trim();
              if (buy && artNo) {
                formattedOrders.push({
                  buyName: buy, po: r[1], batch: r[2], articleNo: artNo, articleName: r[4], pairs: Number(r[5]) || 0
                });
              }
            });
          });
          if (formattedOrders.length === 0) throw new Error('no order rows found');
        } catch (err) {
          resetBtn();
          showMsg('adminMsgBox', 'error', "❌ Excel format did not match (" + err.message + ")");
          return;
        }

        btn.innerText = "Syncing with Cloud... ☁️";
        google.script.run
          .withSuccessHandler(function (msg) {
            resetBtn();
            fileInput.value = "";
            showMsg('adminMsgBox', 'success', msg || "✅ Excel Orders Uploaded!");
          })
          .withFailureHandler(function () {
            resetBtn();
            showMsg('adminMsgBox', 'error', "❌ Upload failed. Check your internet and try again.");
          })
          .saveExcelOrders(formattedOrders);
      };

      reader.readAsArrayBuffer(file);
    }
  
    // ===== Phone / browser Back button: step back inside the app instead of leaving it =====
    (function () {
      function $(id) { return document.getElementById(id); }
      function vis(id) { var e = $(id); return e && !e.classList.contains('hidden'); }
      function loggedIn() { return !vis('loginScreen'); }
      function ensureSentinel() {
        try {
          if (loggedIn() && !(history.state && history.state.app)) history.pushState({ app: 1 }, '');
        } catch (e) { }
      }
      function goBackInApp() {
        if (vis('pickerModal')) { hideModal(); return; }
        if (vis('wReportScreen')) { closeWorkerReport(); return; }
        if (vis('adminPage')) { admMenu(); return; }
        if (vis('workerScreen') && vis('backAdminBtn')) { backToAdmin(); return; }
        // Top level screen: stay here (use Lock & Exit to log out)
      }
      window.addEventListener('popstate', function () {
        if (loggedIn()) { goBackInApp(); ensureSentinel(); }
      });
      var ls = $('loginScreen');
      if (ls && window.MutationObserver) {
        new MutationObserver(ensureSentinel).observe(ls, { attributes: true, attributeFilter: ['class'] });
      }
      document.addEventListener('click', ensureSentinel, true);
    })();

    // Lets the browser install the app (works with manifest.json). No caching, so the latest version always loads.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
    }
</script>
